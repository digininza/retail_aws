# Dev environment overlay. Merged on top of config/base/* by
# src/common/config_loader.py. Only environment-specific values live here —
# business/pipeline logic stays in config/base/.

environment: dev

s3:
  bucket: retail-data-dev
  raw_prefix: raw/
  bronze_prefix: bronze/
  silver_prefix: silver/
  gold_prefix: gold/
  quarantine_prefix: quarantine/
  archive_prefix: archive/
  kms_key_alias: alias/retail-dev-data-key

redshift:
  cluster_identifier: retail-dev-cluster
  database: retaildev
  schema_staging: staging
  schema_curated: curated
  workload_management_queue: dev_etl

glue:
  database: retail_dev_catalog
  execution_role_arn: arn:aws:iam::000000000000:role/retail-dev-glue-execution-role
  worker_type: G.1X
  number_of_workers: 5
  max_concurrent_runs: 3

emr:
  execution_role_arn: arn:aws:iam::000000000000:role/retail-dev-emr-execution-role
  instance_type_master: m5.xlarge
  instance_type_core: m5.xlarge
  core_instance_count: 2
  release_label: emr-7.1.0
  ephemeral: true

airflow:
  environment_name: retail-dev-mwaa
  dag_concurrency: 8
  default_retries: 2

kinesis:
  pos_stream_name: retail-dev-pos-events
  ecommerce_stream_name: retail-dev-ecommerce-events
  shard_count: 2

secrets_manager:
  prefix: retail/dev/

sns:
  alert_topic_arn: arn:aws:sns:us-east-1:000000000000:retail-dev-pipeline-alerts

logging:
  level: DEBUG

feature_flags:
  enable_emr_heavy_pipeline: true
  enable_streaming_pipeline: true
  strict_schema_enforcement: false
