AWSTemplateFormatVersion: "2010-09-09"
Description: >
  RetailCo data lake bucket (Section 5) with per-zone lifecycle rules,
  default KMS encryption, and public access fully blocked. Deployed once per
  environment; the bucket name and KMS key alias are environment-parameterized
  so Dev/QA/Prod never share a bucket (ADR-009).

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]
  KmsKeyArn:
    Type: String
    Description: ARN of the environment's data-lake KMS CMK (created in a companion kms.yaml, not shown)

Resources:
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "retail-data-${Environment}"
      VersioningConfiguration:
        Status: Enabled   # protects raw/ immutability against accidental overwrite (Section 5)
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KmsKeyArn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: raw-to-infrequent-access
            Status: Enabled
            Prefix: raw/
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER
          - Id: quarantine-expire
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: 60
          - Id: archive-deep-glacier
            Status: Enabled
            Prefix: archive/
            Transitions:
              - TransitionInDays: 1
                StorageClass: DEEP_ARCHIVE
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
            Function: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:retail-${Environment}-file-arrival-handler"

Outputs:
  BucketName:
    Value: !Ref DataLakeBucket
  BucketArn:
    Value: !GetAtt DataLakeBucket.Arn
